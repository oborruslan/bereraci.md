[build]
  publish = "."

[[redirects]]
  from = "http://bereraci.md/*"
  to = "https://bereraci.md/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.bereraci.md/*"
  to = "https://bereraci.md/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.bereraci.md/*"
  to = "https://bereraci.md/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/firebase-private/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https://i.imgur.com https://*.imgur.com https://bereraci.md; script-src 'self' 'unsafe-inline' https://identity.netlify.com https://unpkg.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://identity.netlify.com https://api.netlify.com https://*.googleapis.com https://*.firebaseio.com; frame-src https://identity.netlify.com; font-src 'self' data:; manifest-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/browserconfig.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
