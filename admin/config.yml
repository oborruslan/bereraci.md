backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "assets/products"
public_folder: "assets/products"

site_url: "https://bereraci.md"
display_url: "https://bereraci.md"
logo_url: "/logo-raci.jpg"
locale: "ro"

collections:
  - name: "catalog"
    label: "Catalog"
    files:
      - name: "products"
        label: "Produse noi"
        file: "data/products.json"
        fields:
          - label: "Produse"
            name: "products"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Activ pe site"
                name: "active"
                widget: "boolean"
                default: true
              - label: "Denumire produs"
                name: "title"
                widget: "string"
              - label: "Categorie"
                name: "category"
                widget: "select"
                default: "peste"
                options:
                  - { label: "Raci", value: "raci" }
                  - { label: "Pește", value: "peste" }
                  - { label: "Carne afumată", value: "carne-afumata" }
                  - { label: "Cașcaval", value: "cascaval" }
                  - { label: "Snacksuri", value: "snaksuri" }
                  - { label: "Bere", value: "bere" }
                  - { label: "Sucuri fresh", value: "sucuri-fresh" }
              - label: "Imagine produs"
                name: "image"
                widget: "image"
                required: true
                hint: "Acceptă imagini web: PNG, JPG, JPEG, WEBP, GIF sau AVIF."
              - label: "Descriere"
                name: "description"
                widget: "text"
                required: false
              - label: "Preț"
                name: "price"
                widget: "string"
                required: false
                hint: "Exemplu: 44 lei sau Preț negociabil."
              - label: "Gramaj / unitate"
                name: "unit"
                widget: "string"
                required: false
                hint: "Exemplu: 100g sau Găleată."
              - label: "Specificații"
                name: "specs"
                widget: "list"
                required: false
                field:
                  label: "Specificație"
                  name: "spec"
                  widget: "string"
              - label: "Text alternativ imagine"
                name: "alt"
                widget: "string"
                required: false
